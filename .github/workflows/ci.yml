name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the complete verification gate
        run: npm run verify

      - name: Verification must not modify the working tree
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || (echo "::error::Verification left the working tree dirty." && exit 1)
