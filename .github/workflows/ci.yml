name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Semantic conformance check (src/validate.js)
        run: node src/validate.js all

      - name: XSD validation (real XML Schema processor)
        run: python scripts/xsd_validate.py

      - name: Negative tests
        run: node test/run_tests.js

      - name: Deterministic regeneration (committed output must match a fresh build from source)
        run: |
          for layout in madani-v2 madani-v1 madani-v4-tajweed qatar indopak-15 indopak-9-gaba indopak-13-qudratullah indopak-13-taj indopak-16-taj nastaleeq; do
            node src/generate.js --layout=$layout all
          done
          git diff --exit-code -- output/ || (echo "::error::Regenerated output differs from committed output — either the generator changed without regenerating, or committed output was hand-edited." && exit 1)

      - name: Text integrity check (informational — known unexplained residual, see README)
        run: node src/checksum-verify.js || true
