<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUSX API Transition Demo</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17231d;background:#eef2ee;--g:#126a4b;--l:#d5e0d8}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:38px 20px}h1{font:700 clamp(30px,5vw,48px) Georgia,serif;margin:7px 0}.intro{color:#5d6c63;line-height:1.6;max-width:760px}.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch;margin:26px 0}.card{background:white;border:1px solid var(--l);border-radius:14px;padding:16px;min-width:0}.arrow{align-self:center;color:var(--g);font-size:24px}.label{font-size:11px;color:var(--g);font-weight:800;text-transform:uppercase;letter-spacing:.08em}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.55 ui-monospace,monospace;margin:12px 0 0}.arabic{direction:rtl;font-family:"Noto Naskh Arabic",serif;font-size:24px;line-height:1.8}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{border:1px solid var(--l);background:white;border-radius:999px;padding:8px 13px;cursor:pointer}button.active{background:var(--g);color:white}.result{background:#153e2f;color:white;border-radius:14px;padding:18px;margin-top:16px}.result code{color:#bde6d3}@media(max-width:760px){.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg);justify-self:center}}</style></head><body><main>
<div class="label">QUSX transition-layer proof</div><h1>Different providers, one usable shape.</h1><p class="intro">The adapters normalize provider-specific fields. The QUSX SDK then applies the same alignment and ayah-mapping APIs regardless of where the original record came from.</p>
<div class="controls"><button class="active" data-provider="quran">Quran.com-style Hafs</button><button data-provider="kfgqpc">KFGQPC Warsh</button></div>
<section class="flow"><article class="card"><div class="label">Provider response</div><pre id="raw"></pre></article><div class="arrow">→</div><article class="card"><div class="label">Unified verse</div><pre id="normalized"></pre></article><div class="arrow">→</div><article class="card"><div class="label">Rendered text</div><p class="arabic" id="text"></p></article></section>
<section class="result" id="result"></section>
<script type="module">
import {normalizeKfgqpcAyah,normalizeQuranComVerse} from '../../sdk/adapters.mjs';
import {createAlignmentClient,createAyahMappingClient} from '../../sdk/index.mjs';
const [alignment,mapping]=await Promise.all([fetch('../../data/alignments/normative-v1.json').then(r=>r.json()),fetch('../../data/alignments/boundary-v1.json').then(r=>r.json())]);
const slots=createAlignmentClient(alignment),ayahs=createAyahMappingClient(mapping);
const samples={quran:{verse_key:'57:24',words:[{id:1,position:1,location:'57:24:8',text_qpc_hafs:'فَإِنَّ'},{id:2,position:2,location:'57:24:9',text_qpc_hafs:'ٱللَّهَ'},{id:3,position:3,location:'57:24:10',text_qpc_hafs:'هُوَ'}]},kfgqpc:{sura_no:57,aya_no:23,aya_text:'فَإِنَّ اَ۬للَّهَ اَ۬لْغَنِيُّ اُ۬لْحَمِيدُ ٢٣'}};
function render(provider){const raw=samples[provider],verse=provider==='quran'?normalizeQuranComVerse(raw):normalizeKfgqpcAyah(raw,{tradition:'warsh-kfqc'});document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.provider===provider));document.querySelector('#raw').textContent=JSON.stringify(raw,null,2);document.querySelector('#normalized').textContent=JSON.stringify({format:verse.format,source:verse.source,tradition:verse.tradition,reference:verse.reference,words:verse.words},null,2);document.querySelector('#text').textContent=verse.text;const target=verse.tradition==='hafs-kufi'?'warsh-kfqc':'hafs-kufi';const mapped=ayahs.mapAyah(verse.reference,target,verse.tradition);const reading=slots.getReading('qusx:slot:057:024:001',verse.tradition);document.querySelector('#result').innerHTML=`Mapped <code>${verse.reference}</code> from <code>${verse.tradition}</code> to <code>${target}</code>: <code>${mapped.join(', ')||'∅'}</code><br>Alignment slot content: <code>${reading.text||'∅ empty'}</code>`}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.dataset.provider));render('quran');
</script></main></body></html>
